[project]
name = "denovarix-m365-organizer"
version = "0.1.0"
description = "MCP server + CLI to organise a personal Microsoft account (Outlook folders, rules, bulk moves, OneDrive) via Microsoft Graph"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Denovarix" }, { name = "Sourav De" }]
dependencies = ["mcp>=1.2", "msal>=1.28", "requests>=2.31"]

[project.scripts]
m365-organizer = "m365_organizer.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["m365_organizer"]
